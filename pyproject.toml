[project]
name = "researchclaw-codex"
version = "0.1.0"
description = "AutoResearchClaw Codex — a durable, explicitly invoked Codex-native research workflow."
requires-python = ">=3.11"
dependencies = [
    "packaging>=24.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "arxiv>=2.1",
    "numpy>=1.24",
]
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/ParkJaeSeong/AutoResearchClaw-Codex"
Repository = "https://github.com/ParkJaeSeong/AutoResearchClaw-Codex"
Upstream = "https://github.com/aiming-lab/AutoResearchClaw"

[project.optional-dependencies]
anthropic = ["httpx>=0.24"]
web = ["scholarly>=1.7", "crawl4ai>=0.2", "tavily-python>=0.3"]
pdf = ["PyMuPDF>=1.23"]
all = [
    "httpx>=0.24",
    "scholarly>=1.7",
    "crawl4ai>=0.2",
    "tavily-python>=0.3",
    "PyMuPDF>=1.23",
    "huggingface-hub>=0.20",
    "matplotlib>=3.7",
    "scipy>=1.10",
]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx>=0.24"]

[project.scripts]
researchclaw = "researchclaw.cli:main"
researchclaw-codex = "researchclaw.codex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["researchclaw", "sibyl", "arc"]

[tool.pytest.ini_options]
addopts = "-m 'not large_evidence'"
markers = [
    "large_evidence: opt-in 1 GiB immutable evidence streaming benchmark",
]

[tool.ruff]
# The Codex-native release gate owns core/codex and its native tests.  The
# retained upstream autonomous implementation has a pre-existing lint backlog
# and is outside this fork's current execution boundary.
extend-exclude = [
    "researchclaw/agents",
    "researchclaw/calendar",
    "researchclaw/cli.py",
    "researchclaw/copilot",
    "researchclaw/dashboard",
    "researchclaw/domains",
    "researchclaw/evolution.py",
    "researchclaw/experiment",
    "researchclaw/hitl",
    "researchclaw/knowledge",
    "researchclaw/literature",
    "researchclaw/llm",
    "researchclaw/memory",
    "researchclaw/metaclaw_bridge",
    "researchclaw/overleaf",
    "researchclaw/pipeline",
    "researchclaw/server",
    "researchclaw/servers",
    "researchclaw/templates",
    "researchclaw/trends",
    "researchclaw/web",
    "researchclaw/wizard",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
